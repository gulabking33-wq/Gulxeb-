<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gulxeb — CEO Command Center</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#fef6f3;
  --panel:#fff9f6;
  --panel2:#f4e6df;
  --gold:#8c7b51;
  --gold-light:#a7956a;
  --border:rgba(140,123,81,.28);
  --text:#171412;
  --muted:rgba(23,20,18,.55);
  --success:#2e7d4f;
}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,sans-serif;
}

button,
textarea{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ================= TOPBAR ================= */

.topbar{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Playfair Display",serif;
  font-size:17px;
  font-weight:700;
  color:var(--gold);
}

.brand-name{
  font-family:"Playfair Display",serif;
  font-weight:600;
  letter-spacing:2px;
}

.brand-sub{
  display:block;
  font-size:8px;
  letter-spacing:3px;
  color:var(--gold);
  margin-top:2px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:10px;
  letter-spacing:1px;
  color:var(--gold);
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--success);
  box-shadow:0 0 0 3px rgba(46,125,79,.10);
}

/* ================= MAIN ================= */

.main{
  flex:1;
  display:flex;
  min-height:calc(100vh - 64px);
}

/* ================= SIDEBAR ================= */

.sidebar{
  width:225px;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:20px 14px;
  overflow-y:auto;
  flex-shrink:0;
}

.sidebar-title{
  font-size:9px;
  letter-spacing:3px;
  color:var(--gold);
  margin:4px 5px 12px;
}

.dept-btn{
  width:100%;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:11px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  cursor:pointer;
  border-radius:4px;
  margin-bottom:3px;
  transition:.2s;
}

.dept-btn:hover{
  background:rgba(140,123,81,.08);
  color:var(--text);
}

.dept-btn.active{
  background:rgba(140,123,81,.11);
  color:var(--gold);
  border-left:2px solid var(--gold);
}

.icon{
  width:22px;
  text-align:center;
  font-size:17px;
}

.dept-name{
  font-size:12px;
}

/* ================= CONTENT ================= */

.content{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  min-height:0;
}

/* ================= WELCOME ================= */

.welcome{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px;
  text-align:center;
  overflow-y:auto;
}

.welcome-logo{
  width:110px;
  height:110px;
  border:1px solid var(--border);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Playfair Display",serif;
  font-size:38px;
  font-weight:700;
  color:var(--gold);
  margin-bottom:25px;
  box-shadow:0 0 40px rgba(140,123,81,.08);
}

.welcome h1{
  font-family:"Playfair Display",serif;
  font-size:28px;
  font-weight:500;
  margin-bottom:10px;
}

.welcome p{
  max-width:500px;
  color:var(--muted);
  line-height:1.7;
  font-size:13px;
}

.gold-line{
  width:110px;
  height:1px;
  background:var(--gold);
  margin:18px auto;
  opacity:.5;
}

.cards{
  margin-top:28px;
  display:grid;
  grid-template-columns:repeat(3,150px);
  gap:10px;
}

.card{
  background:var(--panel2);
  border:1px solid var(--border);
  padding:17px 10px;
  cursor:pointer;
  transition:.2s;
  border-radius:3px;
}

.card:hover{
  border-color:var(--gold);
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,.04);
}

.card:active{
  transform:translateY(0);
}

.card-icon{
  font-size:23px;
  margin-bottom:7px;
}

.card-title{
  font-size:12px;
  font-weight:500;
}

.card-role{
  color:var(--gold);
  font-size:9px;
  margin-top:4px;
}

/* ================= CHAT ================= */

.chat{
  display:none;
  height:100%;
  min-height:0;
  flex-direction:column;
}

.chat-header{
  min-height:70px;
  padding:14px 22px;
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.agent-icon{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(140,123,81,.08);
  flex-shrink:0;
}

.agent-name{
  font-family:"Playfair Display",serif;
  font-size:16px;
}

.agent-role{
  color:var(--gold);
  font-size:10px;
  letter-spacing:1px;
  margin-top:3px;
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:24px;
  display:flex;
  flex-direction:column;
  gap:16px;
  scroll-behavior:smooth;
}

.message{
  max-width:75%;
  display:flex;
  gap:9px;
  animation:messageIn .2s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message.user{
  align-self:flex-end;
  flex-direction:row-reverse;
}

.avatar{
  width:32px;
  height:32px;
  flex-shrink:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(140,123,81,.09);
  border:1px solid var(--border);
  font-size:13px;
}

.message-content{
  min-width:0;
}

.bubble{
  padding:11px 14px;
  line-height:1.6;
  font-size:13px;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:3px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message.user .bubble{
  background:rgba(140,123,81,.1);
}

.time{
  color:var(--muted);
  font-size:9px;
  margin-top:4px;
}

/* ================= TYPING ================= */

.typing{
  display:none;
  align-items:center;
  gap:5px;
  padding:10px 14px;
  background:var(--panel2);
  border:1px solid var(--border);
  width:max-content;
  border-radius:3px;
}

.typing span{
  width:5px;
  height:5px;
  background:var(--gold);
  border-radius:50%;
  animation:typing 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.30s;
}

@keyframes typing{
  0%,60%,100%{
    opacity:.3;
    transform:translateY(0);
  }
  30%{
    opacity:1;
    transform:translateY(-3px);
  }
}

/* ================= INPUT ================= */

.input-area{
  padding:14px 20px;
  background:var(--panel);
  border-top:1px solid var(--border);
  flex-shrink:0;
}

.input-row{
  display:flex;
  gap:9px;
}

textarea{
  flex:1;
  resize:none;
  min-height:45px;
  max-height:130px;
  padding:12px 14px;
  border:1px solid var(--border);
  background:var(--panel2);
  outline:none;
  color:var(--text);
  border-radius:3px;
  font-size:13px;
  line-height:1.4;
}

textarea::placeholder{
  color:var(--muted);
}

textarea:focus{
  border-color:var(--gold);
}

.send{
  width:46px;
  height:46px;
  border:0;
  background:var(--gold);
  color:white;
  cursor:pointer;
  border-radius:3px;
  font-size:18px;
  flex-shrink:0;
  transition:.2s;
}

.send:hover{
  background:var(--gold-light);
}

.send:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .topbar{
    height:60px;
    padding:0 12px;
  }

  .main{
    min-height:calc(100vh - 60px);
  }

  .sidebar{
    width:68px;
    padding:12px 6px;
  }

  .sidebar-title,
  .dept-name{
    display:none;
  }

  .dept-btn{
    justify-content:center;
    padding:12px 5px;
  }

  .icon{
    width:auto;
  }

  .cards{
    grid-template-columns:repeat(2,130px);
  }

  .welcome{
    padding:20px 12px;
  }

  .welcome-logo{
    width:85px;
    height:85px;
    font-size:30px;
    margin-bottom:18px;
  }

  .welcome h1{
    font-size:23px;
  }

  .welcome p{
    font-size:12px;
  }

  .message{
    max-width:90%;
  }

  .messages{
    padding:16px 12px;
  }

  .input-area{
    padding:10px;
  }

  .brand-name{
    font-size:13px;
  }

  .brand-sub{
    font-size:6px;
    letter-spacing:2px;
  }

  .status{
    font-size:8px;
  }
}

@media(max-width:400px){

  .cards{
    grid-template-columns:repeat(2,115px);
  }

  .card{
    padding:14px 8px;
  }

  .welcome h1{
    font-size:21px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- ================= TOPBAR ================= -->

  <header class="topbar">

    <div class="brand">

      <div class="logo">
        G
      </div>

      <div>
        <div class="brand-name">
          GULXEB
        </div>

        <span class="brand-sub">
          FASHION INDUSTRIES
        </span>
      </div>

    </div>

    <div class="status">
      <span class="status-dot"></span>
      SECURE MODE
    </div>

  </header>


  <!-- ================= MAIN ================= -->

  <main class="main">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

      <div class="sidebar-title">
        DEPARTMENTS
      </div>

      <button class="dept-btn" data-dept="coo" onclick="openDepartment('coo')">
        <span class="icon">⚙️</span>
        <span class="dept-name">COO</span>
      </button>

      <button class="dept-btn" data-dept="cfo" onclick="openDepartment('cfo')">
        <span class="icon">💰</span>
        <span class="dept-name">CFO</span>
      </button>

      <button class="dept-btn" data-dept="hr" onclick="openDepartment('hr')">
        <span class="icon">👥</span>
        <span class="dept-name">HR</span>
      </button>

      <button class="dept-btn" data-dept="marketing" onclick="openDepartment('marketing')">
        <span class="icon">📣</span>
        <span class="dept-name">Marketing</span>
      </button>

      <button class="dept-btn" data-dept="designer" onclick="openDepartment('designer')">
        <span class="icon">🎨</span>
        <span class="dept-name">Designer</span>
      </button>

      <button class="dept-btn" data-dept="calling" onclick="openDepartment('calling')">
        <span class="icon">📞</span>
        <span class="dept-name">Calling</span>
      </button>

    </aside>


    <!-- ================= CONTENT ================= -->

    <section class="content">

      <!-- ================= WELCOME ================= -->

      <div class="welcome" id="welcome">

        <div class="welcome-logo">
          G
        </div>

        <h1>
          CEO Command Center
        </h1>

        <div class="gold-line"></div>

        <p>
          Welcome, Rabbani. Select a department to open
          your Gulxeb executive command channel.
        </p>

        <div class="cards">

          <div class="card" onclick="openDepartment('coo')">
            <div class="card-icon">⚙️</div>
            <div class="card-title">COO</div>
            <div class="card-role">Operations</div>
          </div>

          <div class="card" onclick="openDepartment('cfo')">
            <div class="card-icon">💰</div>
            <div class="card-title">CFO</div>
            <div class="card-role">Finance</div>
          </div>

          <div class="card" onclick="openDepartment('hr')">
            <div class="card-icon">👥</div>
            <div class="card-title">HR</div>
            <div class="card-role">People</div>
          </div>

          <div class="card" onclick="openDepartment('marketing')">
            <div class="card-icon">📣</div>
            <div class="card-title">Marketing</div>
            <div class="card-role">Campaigns</div>
          </div>

          <div class="card" onclick="openDepartment('designer')">
            <div class="card-icon">🎨</div>
            <div class="card-title">Designer</div>
            <div class="card-role">Visuals</div>
          </div>

          <div class="card" onclick="openDepartment('calling')">
            <div class="card-icon">📞</div>
            <div class="card-title">Calling</div>
            <div class="card-role">Customers</div>
          </div>

        </div>

      </div>


      <!-- ================= CHAT ================= -->

      <div class="chat" id="chat">

        <div class="chat-header">

          <div class="agent-icon" id="agentIcon">
            ⚙️
          </div>

          <div>

            <div class="agent-name" id="agentName">
              COO
            </div>

            <div class="agent-role" id="agentRole">
              Operations
            </div>

          </div>

        </div>


        <div class="messages" id="messages"></div>


        <div class="input-area">

          <div class="input-row">

            <textarea
              id="input"
              rows="1"
              placeholder="Type your message..."
              onkeydown="handleKey(event)"
              oninput="autoResize(this)"
            ></textarea>

            <button
              class="send"
              id="send"
              onclick="sendMessage()"
              aria-label="Send message"
            >
              ➤
            </button>

          </div>

        </div>

      </div>

    </section>

  </main>

</div>


<script>

/*
========================================================
GULXEB CEO COMMAND CENTER
========================================================

SECURITY:

This is a frontend-only version.

There is:
- NO API KEY
- NO SECRET TOKEN
- NO PASSWORD
- NO PRIVATE CREDENTIAL

It is safe to upload to GitHub Pages.

IMPORTANT:
GitHub Pages is frontend hosting.
It cannot safely store private API keys.

For real AI later:

Frontend
   ↓
Secure Backend
   ↓
AI API

Never put an AI API key directly inside index.html.

========================================================
*/


/* =====================================================
   DEPARTMENT DATA
===================================================== */

const DEPARTMENTS = {

  coo: {
    name: "Aryan Mehta",
    shortName: "COO",
    role: "Chief Operating Officer",
    icon: "⚙️",

    reply:
      "Good to see you, Sir. I am Aryan Mehta, COO of Gulxeb Fashion Industries. I can help you organize operations, production, inventory, delivery and daily workflow."
  },

  cfo: {
    name: "Priya Sharma",
    shortName: "CFO",
    role: "Chief Financial Officer",
    icon: "💰",

    reply:
      "Good to see you, Sir. I am Priya Sharma, CFO of Gulxeb Fashion Industries. I can help you structure budgets, expenses, revenue tracking, pricing and financial planning."
  },

  hr: {
    name: "Sneha Kapoor",
    shortName: "HR",
    role: "HR Manager",
    icon: "👥",

    reply:
      "Welcome, Sir. I am Sneha Kapoor, HR Manager. I can help with hiring, team structure, attendance, responsibilities, employee workflow and team coordination."
  },

  marketing: {
    name: "Rohan Verma",
    shortName: "Marketing",
    role: "Marketing Head",
    icon: "📣",

    reply:
      "Welcome, Sir. I am Rohan Verma, Marketing Head. I can help with Instagram, Facebook, campaigns, content planning, brand positioning, SEO and customer acquisition."
  },

  designer: {
    name: "Vikram Das",
    shortName: "Designer",
    role: "Creative Designer",
    icon: "🎨",

    reply:
      "Welcome, Sir. I am Vikram Das, Creative Designer. I can help create visual concepts, poster directions, product-shoot ideas, branding concepts and AI design prompts."
  },

  calling: {
    name: "Calling Agent",
    shortName: "Calling",
    role: "Customer Relations",
    icon: "📞",

    reply:
      "Welcome, Sir. I am the Gulxeb Calling Agent. I can help prepare customer-call scripts, enquiry replies, follow-ups, customer communication and sales conversations."
  }

};


/* =====================================================
   STATE
===================================================== */

let currentDepartment = null;


/* =====================================================
   OPEN DEPARTMENT
===================================================== */

function openDepartment(id) {

  const department = DEPARTMENTS[id];

  if (!department) {
    return;
  }

  currentDepartment = id;

  /* Hide welcome screen */
  document.getElementById("welcome").style.display = "none";

  /* Show chat */
  document.getElementById("chat").style.display = "flex";

  /* Update header */
  document.getElementById("agentIcon").textContent = department.icon;

  document.getElementById("agentName").textContent =
    department.name;

  document.getElementById("agentRole").textContent =
    department.role;

  /* Active sidebar */
  document.querySelectorAll(".dept-btn").forEach(button => {

    button.classList.remove("active");

    if (button.dataset.dept === id) {
      button.classList.add("active");
    }

  });

  /* Clear previous chat */
  const messages = document.getElementById("messages");

  messages.innerHTML = "";

  /* Initial message */
  addMessage(
    department.reply,
    false,
    department.icon
  );

  /* Focus input */
  setTimeout(() => {
    document.getElementById("input").focus();
  }, 100);

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(text, isUser, avatar = "G") {

  const messages = document.getElementById("messages");

  const wrapper = document.createElement("div");

  wrapper.className =
    "message" + (isUser ? " user" : "");

  const avatarElement =
    document.createElement("div");

  avatarElement.className = "avatar";

  avatarElement.textContent =
    isUser
      ? "G"
      : avatar;

  const content =
    document.createElement("div");

  content.className = "message-content";

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  const time =
    document.createElement("div");

  time.className = "time";

  time.textContent = getTime();

  content.appendChild(bubble);
  content.appendChild(time);

  wrapper.appendChild(avatarElement);
  wrapper.appendChild(content);

  messages.appendChild(wrapper);

  messages.scrollTop =
    messages.scrollHeight;
}


/* =====================================================
   TIME
===================================================== */

function getTime() {

  return new Date().toLocaleTimeString(
    [],
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =====================================================
   TYPING INDICATOR
===================================================== */

function showTyping() {

  const messages =
    document.getElementById("messages");

  const wrapper =
    document.createElement("div");

  wrapper.className = "message";

  wrapper.id = "typingMessage";

  const avatar =
    document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
    DEPARTMENTS[currentDepartment]?.icon || "G";

  const typing =
    document.createElement("div");

  typing.className = "typing";

  typing.style.display = "flex";

  typing.innerHTML =
    "<span></span><span></span><span></span>";

  wrapper.appendChild(avatar);
  wrapper.appendChild(typing);

  messages.appendChild(wrapper);

  messages.scrollTop =
    messages.scrollHeight;

}


/* =====================================================
   REMOVE TYPING
===================================================== */

function removeTyping() {

  const typing =
    document.getElementById("typingMessage");

  if (typing) {
