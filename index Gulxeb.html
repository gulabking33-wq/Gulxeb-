<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gulxeb — CEO Command Center</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#fef6f3;
  --panel:#fff9f6;
  --panel2:#f4e6df;
  --gold:#8c7b51;
  --gold-light:#a7956a;
  --border:rgba(140,123,81,.28);
  --text:#171412;
  --muted:rgba(23,20,18,.55);
  --success:#2e7d4f;
}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,sans-serif;
}

button,
textarea{
  font-family:inherit;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* TOPBAR */

.topbar{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Playfair Display",serif;
  font-size:17px;
  font-weight:700;
  color:var(--gold);
}

.brand-name{
  font-family:"Playfair Display",serif;
  font-weight:600;
  letter-spacing:2px;
}

.brand-sub{
  display:block;
  font-size:8px;
  letter-spacing:3px;
  color:var(--gold);
  margin-top:2px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:10px;
  letter-spacing:1px;
  color:var(--gold);
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--success);
}

/* MAIN */

.main{
  flex:1;
  display:flex;
  min-height:0;
}

/* SIDEBAR */

.sidebar{
  width:225px;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:20px 14px;
  overflow-y:auto;
}

.sidebar-title{
  font-size:9px;
  letter-spacing:3px;
  color:var(--gold);
  margin:4px 5px 12px;
}

.dept-btn{
  width:100%;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:11px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  cursor:pointer;
  border-radius:4px;
  margin-bottom:3px;
  transition:.2s;
}

.dept-btn:hover{
  background:rgba(140,123,81,.08);
  color:var(--text);
}

.dept-btn.active{
  background:rgba(140,123,81,.11);
  color:var(--gold);
  border-left:2px solid var(--gold);
}

.icon{
  width:22px;
  text-align:center;
  font-size:17px;
}

.dept-name{
  font-size:12px;
}

/* CONTENT */

.content{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

/* WELCOME */

.welcome{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px;
  text-align:center;
}

.welcome-logo{
  width:110px;
  height:110px;
  border:1px solid var(--border);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Playfair Display",serif;
  font-size:38px;
  font-weight:700;
  color:var(--gold);
  margin-bottom:25px;
}

.welcome h1{
  font-family:"Playfair Display",serif;
  font-size:28px;
  font-weight:500;
  margin-bottom:10px;
}

.welcome p{
  max-width:500px;
  color:var(--muted);
  line-height:1.7;
  font-size:13px;
}

.gold-line{
  width:110px;
  height:1px;
  background:var(--gold);
  margin:18px auto;
  opacity:.5;
}

.cards{
  margin-top:28px;
  display:grid;
  grid-template-columns:repeat(3,150px);
  gap:10px;
}

.card{
  background:var(--panel2);
  border:1px solid var(--border);
  padding:17px 10px;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  border-color:var(--gold);
  transform:translateY(-2px);
}

.card-icon{
  font-size:23px;
  margin-bottom:7px;
}

.card-title{
  font-size:12px;
  font-weight:500;
}

.card-role{
  color:var(--gold);
  font-size:9px;
  margin-top:4px;
}

/* CHAT */

.chat{
  display:none;
  height:100%;
  flex-direction:column;
}

.chat-header{
  min-height:70px;
  padding:14px 22px;
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}

.agent-icon{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(140,123,81,.08);
}

.agent-name{
  font-family:"Playfair Display",serif;
  font-size:16px;
}

.agent-role{
  color:var(--gold);
  font-size:10px;
  letter-spacing:1px;
  margin-top:3px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:24px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.message{
  max-width:75%;
  display:flex;
  gap:9px;
}

.message.user{
  align-self:flex-end;
  flex-direction:row-reverse;
}

.avatar{
  width:32px;
  height:32px;
  flex-shrink:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(140,123,81,.09);
  border:1px solid var(--border);
  font-size:13px;
}

.bubble{
  padding:11px 14px;
  line-height:1.6;
  font-size:13px;
  background:var(--panel2);
  border:1px solid var(--border);
}

.message.user .bubble{
  background:rgba(140,123,81,.1);
}

.time{
  color:var(--muted);
  font-size:9px;
  margin-top:4px;
}

/* INPUT */

.input-area{
  padding:14px 20px;
  background:var(--panel);
  border-top:1px solid var(--border);
}

.input-row{
  display:flex;
  gap:9px;
}

textarea{
  flex:1;
  resize:none;
  min-height:45px;
  max-height:130px;
  padding:12px 14px;
  border:1px solid var(--border);
  background:var(--panel2);
  outline:none;
  color:var(--text);
  border-radius:3px;
}

textarea:focus{
  border-color:var(--gold);
}

.send{
  width:46px;
  height:46px;
  border:0;
  background:var(--gold);
  color:white;
  cursor:pointer;
  border-radius:3px;
  font-size:18px;
}

.send:hover{
  background:var(--gold-light);
}

/* MOBILE */

@media(max-width:700px){

  .topbar{
    padding:0 14px;
  }

  .sidebar{
    width:70px;
    padding:12px 7px;
  }

  .sidebar-title,
  .dept-name{
    display:none;
  }

  .dept-btn{
    justify-content:center;
    padding:12px 5px;
  }

  .cards{
    grid-template-columns:repeat(2,130px);
  }

  .welcome h1{
    font-size:23px;
  }

  .message{
    max-width:90%;
  }

  .brand-name{
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="brand">
      <div class="logo">G</div>

      <div>
        <div class="brand-name">GULXEB</div>
        <span class="brand-sub">FASHION INDUSTRIES</span>
      </div>
    </div>

    <div class="status">
      <span class="status-dot"></span>

  </header>


  <main class="main">

    <aside class="sidebar">

      <button class="dept-btn" onclick="openDepartment('coo')">
        <span class="icon">⚙️</span>

        <span class="icon">📣</span>
        <span class="dept-name">Marketing</span>
      </button>

      <button class="dept-btn" onclick="openDepartment('designer')">
        <span class="icon">🎨</span>
        <span class="dept-name">Designer</span>
      </button>

      <button class="dept-btn" onclick="openDepartment('calling')">
        <span class="icon">📞</span>
        <span class="dept-name">Calling</span>
      </button>

    </aside>


    <section class="content">

      <!-- WELCOME -->

      <div class="welcome" id="welcome">

        <div class="welcome-logo">
          G
        </div>

        <h1>CEO Command Center</h1>

        <div class="gold-line"></div>

        <p>
          Welcome, Rabbani. Select a department to open
          your Gulxeb executive command channel.
        </p>

        <div class="cards">

          <div class="card" onclick="openDepartment('coo')">
            <div class="card-icon">⚙️</div>
            <div class="card-title">COO</div>
            <div class="card-role">Operations</div>
          </div>

          <div class="card" onclick="openDepartment('cfo')">
            <div class="card-icon">💰</div>
            <div class="card-title">CFO</div>
            <div class="card-role">Finance</div>
          </div>

          <div class="card" onclick="openDepartment('hr')">
            <div class="card-icon">👥</div>
            <div class="card-title">HR</div>
            <div class="card-role">People</div>
          </div>

          <div class="card" onclick="openDepartment('marketing')">
            <div class="card-icon">📣</div>
            <div class="card-title">Marketing</div>
            <div class="card-role">Campaigns</div>
          </div>

          <div class="card" onclick="openDepartment('designer')">
            <div class="card-icon">🎨</div>
            <div class="card-title">Designer</div>
            <div class="card-role">Visuals</div>
          </div>

          <div class="card" onclick="openDepartment('calling')">
            <div class="card-icon">📞</div>
            <div class="card-title">Calling</div>
            <div class="card-role">Customers</div>
          </div>

        </div>

      </div>


      <!-- CHAT -->

      <div class="chat" id="chat">

        <div class="chat-header">

          <div class="agent-icon" id="agentIcon">
            ⚙️
          </div>

          <div>
            <div class="agent-name" id="agentName">
              COO
            </div>

            <div class="agent-role" id="agentRole">
              Operations
            </div>
          </div>

        </div>


        <div class="messages" id="messages"></div>


        <div class="input-area">

          <div class="input-row">

            <textarea
              id="input"
              rows="1"
              placeholder="Type your message..."
              onkeydown="handleKey(event)"
            ></textarea>

            <button
              class="send"
              id="send"
              onclick="sendMessage()"
            >
              ➤
            </button>

          </div>

        </div>

      </div>

    </section>

  </main>

</div>
